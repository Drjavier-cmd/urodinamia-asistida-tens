    <script>
      (function restoreCourseRoute(location) {
        if (!location.search.startsWith("?/")) return;
        var route = location.search
          .slice(2)
          .split("&")
          .map(function restoreQueryPart(part) { return part.replace(/~and~/g, "&"); })
          .join("?");
        window.history.replaceState(null, "", location.pathname + route + location.hash);
      }(window.location));
    </script>
