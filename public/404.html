<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abriendo Urodinamia asistida</title>
    <script>
      (function redirectToSinglePageApp(location) {
        var pathSegmentsToKeep = 1;
        var basePath = location.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/");
        var routePath = location.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/");
        var query = location.search ? "&" + location.search.slice(1).replace(/&/g, "~and~") : "";
        location.replace(
          location.protocol + "//" + location.hostname + (location.port ? ":" + location.port : "")
          + basePath + "/?/" + routePath.replace(/&/g, "~and~") + query + location.hash
        );
      }(window.location));
    </script>
  </head>
  <body>
    <p>Abriendo el curso…</p>
  </body>
</html>
